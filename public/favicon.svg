<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f1c" />
      <stop offset="50%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1420" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Octagonal Cyberdeck Chassis -->
  <polygon points="12,2 52,2 62,12 62,52 52,62 12,62 2,52 2,12" fill="url(#bgGrad)" stroke="#1a3449" stroke-width="2" />

  <!-- Outer Neon Trim -->
  <polygon points="14,5 50,5 59,14 59,50 50,59 14,59 5,50 5,14" fill="none" stroke="url(#cyberGrad)" stroke-width="1.5" opacity="0.8" />

  <!-- Internal Circuit Node Traces -->
  <line x1="10" y1="32" x2="18" y2="32" stroke="#ff9f1c" stroke-width="1.5" stroke-linecap="round" />
  <line x1="54" y1="32" x2="46" y2="32" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="18" cy="32" r="2" fill="#ff9f1c" />
  <circle cx="46" cy="32" r="2" fill="#00e5ff" />

  <!-- Central Micro-CRT Display Box -->
  <rect x="18" y="16" width="28" height="32" rx="3" fill="#03080e" stroke="url(#cyberGrad)" stroke-width="1.5" filter="url(#glow)" />

  <!-- Terminal Data Grid / Lines -->
  <line x1="22" y1="23" x2="38" y2="23" stroke="#ff9f1c" stroke-width="2" stroke-linecap="round" />
  <line x1="22" y1="29" x2="33" y2="29" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" />
  <line x1="22" y1="35" x2="42" y2="35" stroke="#ff9f1c" stroke-width="2" stroke-linecap="round" />

  <!-- Blinking Green Cursor Byte -->
  <rect x="22" y="40" width="5" height="3" fill="#00ff66" />
</svg>
